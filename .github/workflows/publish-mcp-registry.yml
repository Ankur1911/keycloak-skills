name: Publish to MCP Registry

# Publishes registry/server.json (the hosted server at https://mcp.phasetwo.io/mcp)
# to the Official MCP Registry as io.github.p2-inc/keycloak.
#
# Why GitHub Actions: an io.github.<org>/* name needs proof of the org. The
# interactive `mcp-publisher login github` flow can't read org roles, so it only
# grants a personal namespace. GitHub OIDC from a workflow in this repo proves
# p2-inc directly, so no PAT or secret is stored.
#
# Run it by hand from the Actions tab after a change to registry/server.json.
# The registry rejects a version that's already published, so bump "version"
# with each change.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish server.json
    # Only publish what's on main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC login to the registry
      contents: read
    env:
      # Pinned deliberately; the Sigstore check below verifies this exact release.
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@v6

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Validate server.json
        run: ./mcp-publisher validate registry/server.json

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish registry/server.json
